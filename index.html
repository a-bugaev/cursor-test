<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Classic Tetris</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Lines</span><strong id="lines">0</strong></div>
        <div class="stat"><span>Level</span><strong id="level">1</strong></div>
      </header>

      <section class="board-col">
        <div class="game-wrap">
          <canvas id="tetris" width="300" height="600" aria-label="Tetris playfield"></canvas>
        </div>
        <nav class="touch-controls" aria-label="Game controls">
          <button type="button" class="ctrl-btn" data-action="left" aria-label="Move left">←</button>
          <button type="button" class="ctrl-btn" data-action="rotate" aria-label="Rotate">↻</button>
          <button type="button" class="ctrl-btn" data-action="right" aria-label="Move right">→</button>
          <button type="button" class="ctrl-btn wide" data-action="soft" aria-label="Soft drop">↓</button>
          <button type="button" class="ctrl-btn wide" data-action="hard" aria-label="Hard drop">⤓</button>
        </nav>
      </section>

      <aside class="sidebar">
        <h1>Classic Tetris</h1>
        <div class="controls desktop-only">
          <p><kbd>←</kbd> <kbd>→</kbd> Move</p>
          <p><kbd>↓</kbd> Soft drop</p>
          <p><kbd>↑</kbd> Rotate</p>
          <p><kbd>Space</kbd> Hard drop</p>
          <p><kbd>P</kbd> Pause · <kbd>R</kbd> Restart</p>
        </div>
        <div class="actions">
          <button id="pause" type="button">Pause</button>
          <button id="restart" type="button">Restart</button>
          <button id="share" type="button">Share</button>
        </div>
      </aside>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
